[package]
name = "obsidian-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = "0.5"
atomic-write-file = "0.3"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
# Same verifier and store as bookmarkd, so its passkey database can be reused as-is.
bookmarkd-auth = { git = "https://github.com/zhangchaosd/bookmarkd", tag = "v0.4.0" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
flate2 = "1"
futures-util = "0.3"
http = "1"
mime_guess = "2"
notify = "8"
percent-encoding = "2"
pulldown-cmark = "0.13"
rand = "0.9"
rust-embed = { version = "8", features = ["compression"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tar = "0.4"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[dev-dependencies]
http-body-util = "0.1"
# A software authenticator for end-to-end passkey tests.
openssl = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
tempfile = "3"
webauthn-rs-core = "0.5.5"

[lints]
workspace = true
