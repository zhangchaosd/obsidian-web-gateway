<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Northstar project pulse</title>
  <desc id="desc">A purple project dashboard showing progress at seventy-two percent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2b2434"/><stop offset="1" stop-color="#17141c"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ad8fe1"/><stop offset="1" stop-color="#7657ad"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="-10" r="230" fill="#7454aa" opacity=".18"/>
  <circle cx="1010" cy="360" r="190" fill="#9b7bca" opacity=".10"/>
  <g font-family="Inter,system-ui,sans-serif" fill="#f5f0f8">
    <text x="72" y="76" font-size="18" font-weight="700" letter-spacing="3" fill="#b9a2df">NORTHSTAR / WEEK 36</text>
    <text x="72" y="145" font-size="44" font-weight="650">Project pulse</text>
    <text x="72" y="188" font-size="20" fill="#aaa2ae">Aurora is on track for the September milestone.</text>
    <text x="1000" y="150" text-anchor="end" font-size="64" font-weight="650">72%</text>
    <text x="1000" y="184" text-anchor="end" font-size="16" fill="#aaa2ae">overall progress</text>
  </g>
  <rect x="72" y="244" width="1056" height="14" rx="7" fill="#403847"/>
  <rect x="72" y="244" width="760" height="14" rx="7" fill="url(#bar)"/>
  <g font-family="Inter,system-ui,sans-serif" font-size="15" fill="#aaa2ae">
    <text x="72" y="305">12 tasks completed</text><text x="548" y="305">4 in progress</text><text x="1000" y="305">2 blocked</text>
  </g>
</svg>
